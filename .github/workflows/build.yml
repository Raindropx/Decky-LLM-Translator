name: Build and Release

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version to release (e.g., v0.7.2). Leave empty for dev build only.'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      package_version: ${{ steps.version.outputs.package_version }}
      is_release: ${{ steps.version.outputs.is_release }}
      sha256: ${{ steps.dependencies_hash.outputs.sha256 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm@11

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Test frontend
        run: |
          pnpm test
          pnpm exec tsc --noEmit

      - name: Build frontend
        run: pnpm run build

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Create dependencies directory
        run: mkdir -p dependencies_build

      - name: Install Python packages (Python 3.13)
        run: |
          pip install -r requirements.txt -t dependencies_build/py_modules --no-cache-dir

      - name: Install cp311 packages for Decky Loader runtime
        run: |
          pip install evdev-binary -t dependencies_build/py_modules --no-cache-dir --python-version 3.11 --only-binary=:all: --platform manylinux_2_28_x86_64 --no-deps

      - name: Test backend
        run: |
          PYTHONPATH="$PWD/dependencies_build/py_modules" python -m unittest discover -s tests -p 'test_*.py'
          python -m compileall -q main.py py_modules/providers

      - name: Strip unnecessary packages and test files
        run: |
          cd dependencies_build/py_modules
          # Remove packages not needed at runtime (onnxruntime optional deps)
          rm -rf sympy sympy-*.dist-info sympy-*.data isympy.py
          rm -rf mpmath mpmath-*.dist-info
          rm -rf flatbuffers flatbuffers-*.dist-info
          rm -rf protobuf-*.dist-info
          # tqdm is needed by rapidocr 3.x -- do NOT remove
          # Remove full opencv-python (rapidocr pulls it in, but we only need headless)
          rm -rf opencv_python.libs opencv_python-*.dist-info
          # Reinstall headless to overwrite cv2/ module (full version's cv2 references wrong .libs)
          pip install opencv-python-headless -t . --no-cache-dir --upgrade --force-reinstall --no-deps
          # Remove rapidocr bundled models (we use our own)
          rm -rf rapidocr/models
          # rapidocr requires empty folder, otherwise it breaks
          mkdir -p rapidocr/models
          # Strip test directories, __pycache__, and .pyc files
          find . -type d -name "tests" -exec rm -rf {} + 2>/dev/null || true
          find . -type d -name "test" -exec rm -rf {} + 2>/dev/null || true
          find . -type d -name "testing" -exec rm -rf {} + 2>/dev/null || true
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find . -name "*.pyc" -delete 2>/dev/null || true
          find . -name "*.pyi" -delete 2>/dev/null || true
          rm -rf numpy/_pyinstaller onnxruntime/datasets
          echo "py_modules size after cleanup: $(du -sh . | cut -f1)"

      - name: Download Python 3.13 portable runtime
        run: |
          mkdir -p dependencies_build/python313
          curl -L -o dependencies_build/python313/python-3.13.tar.gz \
            "https://github.com/astral-sh/python-build-standalone/releases/download/20260408/cpython-3.13.13%2B20260408-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz"
          echo "a1dbc39f9c7b7d4ff3074fa18de66714c4e4400643bd657894a65803b0362a92  dependencies_build/python313/python-3.13.tar.gz" | sha256sum -c
          cd dependencies_build/python313 && tar -xzf python-3.13.tar.gz && rm python-3.13.tar.gz

      - name: Create dependencies archive
        run: |
          cd dependencies_build
          tar -czvf ../plugin-dependencies.tar.gz py_modules python313

      - name: Calculate dependencies SHA256
        id: dependencies_hash
        run: |
          HASH=$(sha256sum plugin-dependencies.tar.gz | cut -d' ' -f1)
          echo "sha256=$HASH" >> $GITHUB_OUTPUT
          echo "Dependencies SHA256: $HASH"

      - name: Get version
        id: version
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.release_version }}
        run: |
          if [[ -n "$RELEASE_VERSION_INPUT" ]]; then
            RAW_VERSION="$RELEASE_VERSION_INPUT"
            if [[ ! "$RAW_VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "release_version must use vX.Y.Z or X.Y.Z" >&2
              exit 1
            fi
            PACKAGE_VERSION="${RAW_VERSION#v}"
            VERSION="v${PACKAGE_VERSION}"
            IS_RELEASE="true"
          else
            VERSION="dev-$(echo ${{ github.sha }} | cut -c1-7)"
            PACKAGE_VERSION=""
            IS_RELEASE="false"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (is_release: $IS_RELEASE)"

      - name: Update package.json with release values
        if: steps.version.outputs.is_release == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.version }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          DEPENDENCIES_SHA256: ${{ steps.dependencies_hash.outputs.sha256 }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python .github/scripts/update_package_release.py \
            --package package.json \
            --repository "$RELEASE_REPOSITORY" \
            --release-tag "$RELEASE_TAG" \
            --package-version "$PACKAGE_VERSION" \
            --sha256 "$DEPENDENCIES_SHA256"
          grep "version" package.json | head -1
          grep -A5 "remote_binary" package.json

      - name: Commit and tag release
        if: steps.version.outputs.is_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet package.json; then
            echo "No changes to package.json"
          else
            git add package.json
            git commit -m "chore: update package.json for release ${{ steps.version.outputs.version }}

          - Set remote_binary URL to ${{ steps.version.outputs.version }}
          - Set SHA256 hash to ${{ steps.dependencies_hash.outputs.sha256 }}"

            git push origin HEAD:main
          fi

          git tag -fa "${{ steps.version.outputs.version }}" -m "Release ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}" --force

      - name: Update package.json for dev build
        if: steps.version.outputs.is_release != 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.version }}
          DEPENDENCIES_SHA256: ${{ steps.dependencies_hash.outputs.sha256 }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python .github/scripts/update_package_release.py \
            --package package.json \
            --repository "$RELEASE_REPOSITORY" \
            --release-tag "$RELEASE_TAG" \
            --sha256 "$DEPENDENCIES_SHA256"
          grep -A5 "remote_binary" package.json

      - name: Package plugin
        run: |
          rm -rf out
          STAGE="out/_staging/decky-llm-translator"
          mkdir -p "$STAGE/dist" "$STAGE/py_modules"
          cp main.py plugin.json package.json README.md LICENSE "$STAGE/"
          cp -R dist/. "$STAGE/dist/"
          cp -R py_modules/providers "$STAGE/py_modules/"
          find "$STAGE" -type d -name __pycache__ -prune -exec rm -rf {} +
          find "$STAGE" -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          (cd out/_staging && zip -qr "../Decky LLM Translator.zip" decky-llm-translator)
          python - <<'PY'
          from pathlib import PurePosixPath
          from zipfile import ZipFile

          archive = "out/Decky LLM Translator.zip"
          with ZipFile(archive) as bundle:
              files = [name.replace("\\", "/") for name in bundle.namelist() if not name.endswith("/")]

          roots = sorted({PurePosixPath(name).parts[0] for name in files})
          if roots != ["decky-llm-translator"]:
              raise SystemExit(f"unexpected ZIP roots: {roots}")

          required = {
              "decky-llm-translator/plugin.json",
              "decky-llm-translator/package.json",
              "decky-llm-translator/main.py",
              "decky-llm-translator/dist/index.js",
          }
          missing = sorted(required.difference(files))
          if missing:
              raise SystemExit(f"missing required ZIP files: {missing}")
          if any("__pycache__" in PurePosixPath(name).parts or name.endswith((".pyc", ".pyo")) for name in files):
              raise SystemExit("ZIP contains transient Python bytecode")

          print(f"Validated {archive}: {len(files)} files, one top-level plugin directory")
          PY

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: decky-llm-translator-plugin
          path: out/*.zip

      - name: Upload dependencies artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-dependencies
          path: plugin-dependencies.tar.gz

  release:
    if: needs.build.outputs.is_release == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: decky-llm-translator-plugin
          path: ./

      - name: Download dependencies artifact
        uses: actions/download-artifact@v4
        with:
          name: plugin-dependencies
          path: ./

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          token: ${{ github.token }}
          files: |
            Decky LLM Translator.zip
            plugin-dependencies.tar.gz
          draft: true
          generate_release_notes: true
